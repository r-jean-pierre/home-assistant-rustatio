name: Bug report
description: Report a problem with the Rustatio Home Assistant integration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough information to reproduce it.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Rustatio integration version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: rustatio_version
    attributes:
      label: Rustatio version
      placeholder: "2.x"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Home Assistant logs
      description: Remove tokens or other secrets before posting logs.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed API tokens and other secrets from logs.
          required: true
        - label: I checked that Rustatio itself is reachable.
          required: true
